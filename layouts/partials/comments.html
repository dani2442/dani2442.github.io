<div class="giscus"></div>
<script>
  (function () {
    // PaperMod stores the active theme in <html data-theme="light|dark">.
    function giscusTheme() {
      return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    var attrs = {
      "data-repo": "dani2442/comments_section",
      "data-repo-id": "R_kgDOP7g6QQ",
      "data-category-id": "DIC_kwDOP7g6Qc4CwMx_",
      "data-mapping": "pathname",
      "data-strict": "0",
      "data-reactions-enabled": "1",
      "data-emit-metadata": "0",
      "data-input-position": "top",
      "data-theme": giscusTheme(),
      "data-lang": "en",
      "crossorigin": "anonymous"
    };
    var s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.async = true;
    Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
    document.currentScript.after(s);

    // Follow the site's theme toggle.
    new MutationObserver(function () {
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusTheme() } } },
        "https://giscus.app"
      );
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>
