baseURL: https://dani2442.github.io/
languageCode: en-us
title: dani2442's Blog
theme: "PaperMod"

comments: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: G-1WNMYZJ1S9

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, Machine Learning, Mathematics, Programming]
  author: Daniel López Montero
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  ShowCodeCopyButtons: true
  #comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true # to disable highlight.js
    disableFingerprinting: true
    favicon: "assets/img/favico/favicon.ico"
    favicon16x16: "assets/img/favico/favicon-16x16.png"
    favicon32x32: "assets/img/favico/favicon-32x32.png"
    favicon192x192: "assets/img/favico/favicon-192x192.png"
    favicon512x512: "assets/img/favico/favicon-512x512.png"
    apple_touch_icon: "assets/img/favico/apple-touch-icon.png"
    safari_pinned_tab: "assets/img/favico/apple-touch-icon.png"

  label:
    text: "Home"
    icon: "assets/img/favico/apple-touch-icon.png"
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "img location"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Welcome to Dani's Blog"
    Content: Hi, this is Daniel López Montero. I will upload notes, projects and some thoughts on topics I am interested in. I am a PhD student of Mathematics researching in Machine Learning, and like to program, read and play football, basketball and padel in my spare time.

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/dlopez24/"
    - name: youtube
      url: "https://youtube.com/c/dProgrammerLopez"
    - name: Github
      url: "https://github.com/dani2442"
    - name: Google Scholar
      url: "https://scholar.google.com/citations?user=0nOOKpgAAAAJ"
    - name: Email
      url: "mailto:dlopez31415@gmail.com"
    - name: CV
      url: "https://github.com/dani2442"
    - name: x
      url: "https://x.com/DprogrammerL"
    

  analytics:
    google:
      SiteVerificationTag: "G-1WNMYZJ1S9"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: false # hide everywhere but not in structured data
  #  hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/dani2442/dani2442.github.io/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: Blog
      name: blog
      url: /
      weight: 10
    - identifier: Events
      name: events
      url: /events/
      weight: 15
    - identifier: archives
      name: archives
      url: /archives/
      weight: 20
    - identifier: essays
      name: essays
      url: /essays/
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 40
    
    # - identifier: web page
    #   name: dprogrammer.org
    #   url: http://dprogrammer.org
    #   weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          #- - \[
          #  - \]
          - - $$
            - $$
          inline:
          #- - \(
          #  - \)
          - - $
            - $
        enable: true
